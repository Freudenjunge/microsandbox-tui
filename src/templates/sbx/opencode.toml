[meta]
name = "OpenCode"
description = "OpenCode, the open-source terminal coding agent, from the sbx org on Docker Hub — pulls 0.4k"

[spec]
image = "sbx/opencode-image"
name = "opencode"
cpus = 2
memory = "4G"
# 16G writable root disk: the ~4G managed default fills up fast once the
# agent installs toolchains (rustup + cargo target/ alone can top 4G).
root_disk = "16G"
mount_cwd = true
