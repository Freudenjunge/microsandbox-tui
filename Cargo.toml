[package]
name = "microsandbox-tui"
version = "0.1.0"
edition = "2024"
description = "A Docker sbx-style TUI for microsandbox"
license = "Apache-2.0"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
microsandbox = { version = "0.7.2", default-features = false, features = [
    "local",
    "net",
    "download-binaries",
] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
which = "7"

[profile.release]
opt-level = 2
strip = true