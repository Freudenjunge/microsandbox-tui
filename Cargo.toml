[package]
name = "microsandbox-tui"
# Release builds take their version from the pushed `v*` tag: the release
# workflow injects `MSB_TUI_VERSION` at compile time (see `src/selfupdate.rs`
# and `.github/workflows/release.yml`). This manifest value is only the
# fallback for local / `cargo install --git` builds — never bump it by hand.
version = "0.0.0-dev"
edition = "2024"
description = "A Docker sbx-style TUI for microsandbox"
license = "Apache-2.0"

[[bin]]
name = "msb-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
microsandbox = { version = "0.7.8", default-features = false, features = [
    "local",
    "net",
    "download-binaries",
] }
microsandbox-types = "0.7.8"
microsandbox-utils = "0.7.8"
semver = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
# OS keyring for credential secrets (#6): the features pin real OS stores —
# Windows Credential Manager (`windows-native`), macOS Keychain
# (`apple-native`), DBus Secret Service on Linux (`sync-secret-service`,
# `crypto-rust` encrypts secrets crossing the bus); without a store feature
# keyring would silently fall back to its mock store.
keyring = { version = "3", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
chrono = { version = "0.4", features = ["serde", "clock"] }
unicode-width = "0.2"
# Self-update: check GitHub Releases for a newer stable msb-tui, download
# the platform tarball, sha256-verify it, and swap the running binary.
# reqwest 0.13 renamed the `rustls-tls` feature to `rustls`; default
# features stay off so TLS comes from rustls (matching the SDK tree).
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

[profile.release]
opt-level = 2
strip = true