[package]
name = "microsandbox-tui"
version = "0.3.0"
edition = "2024"
description = "A Docker sbx-style TUI for microsandbox"
license = "Apache-2.0"

[[bin]]
name = "msb-tui"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
microsandbox = { version = "0.7.8", default-features = false, features = [
    "local",
    "net",
    "download-binaries",
] }
microsandbox-types = "0.7.8"
microsandbox-utils = "0.7.8"
semver = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "codec"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }
unicode-width = "0.2"
# Self-update: check GitHub Releases for a newer stable msb-tui, download
# the platform tarball, sha256-verify it, and swap the running binary.
# reqwest 0.13 renamed the `rustls-tls` feature to `rustls`; default
# features stay off so TLS comes from rustls (matching the SDK tree).
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "rustls",
] }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"

[profile.release]
opt-level = 2
strip = true