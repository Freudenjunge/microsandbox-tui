[package]
name = "microsandbox-tui"
version = "0.1.0"
edition = "2024"
description = "A Docker sbx-style TUI for microsandbox"
license = "Apache-2.0"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
unicode-width = "0.2"
which = "7"

[profile.release]
opt-level = 2
strip = true